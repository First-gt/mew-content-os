<!-- ==============================================================================
     MEW CONTENT OS - Topic T21: Remix Draft Selection - Resume (S06)
     Theme: mewteetawat.com V6.3 (Warm Stone, Coral, Violet & Deep Ink)
     Pure Client-Side Component · Zero Server Dependencies · Zero Fake Metrics
     ============================================================================== -->

<div class="resume-selection-banner-container" id="resume-banner-root">
  <aside 
    id="banner-resume-selection" 
    data-testid="banner-resume-selection"
    class="resume-selection-banner mew-offer-card" 
    role="region" 
    aria-label="แจ้งเตือนวัตถุดิบ Remix ที่เลือกค้างอยู่"
    hidden
  >
    <!-- Top Accent Bar (Coral & Violet V6.3 Accent) -->
    <div class="resume-accent-bar" aria-hidden="true"></div>

    <div class="resume-banner-body">
      <!-- Left Content: Icon, Title, Counts & Chips Preview -->
      <div class="resume-banner-left">
        <div class="resume-icon-badge" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </div>

        <div class="resume-text-content">
          <div class="resume-headline-row">
            <h4 class="resume-title" id="resume-title">คุณมีวัตถุดิบ Remix ที่เลือกค้างไว้</h4>
            <span class="resume-counts-pill font-num" id="resume-items-count">0 รายการ</span>
            <span class="resume-breakdown-pill font-num" id="resume-breakdown-text" hidden></span>
          </div>

          <p class="resume-description" id="resume-description">
            ระบบเก็บรายการวัตถุดิบที่คุณเลือกไว้ล่าสุด เพื่อให้คุณกลับมาปรุงต่อได้ทันทีโดยไม่ต้องเริ่มต้นใหม่
          </p>

          <!-- Selected Ingredients Chips Preview -->
          <div class="resume-chips-preview" id="resume-chips-preview" aria-label="รายการวัตถุดิบในตะกร้า"></div>
        </div>
      </div>

      <!-- Right Action Group -->
      <div class="resume-actions-group">
        <button 
          type="button" 
          id="btn-resume" 
          data-testid="btn-resume"
          class="btn-pill btn-primary btn-sm btn-resume-cta" 
          aria-label="ทำต่อจากที่เลือกไว้ใน Remix Studio"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>ปรุงต่อจากที่เลือกไว้</span>
        </button>

        <button 
          type="button" 
          id="btn-discard-selection" 
          data-testid="btn-discard-selection"
          class="btn-pill btn-ghost btn-sm btn-discard" 
          aria-label="ละทิ้งตะกร้าที่ค้างไว้"
          aria-haspopup="dialog"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
          <span>ล้างตะกร้า</span>
        </button>
      </div>
    </div>

    <!-- Inline Accessible Confirmation Dialog for Discard Action -->
    <div 
      id="discard-confirm-dialog" 
      data-testid="discard-confirm-dialog"
      class="discard-confirm-dialog" 
      role="alertdialog" 
      aria-modal="true" 
      aria-labelledby="discard-dialog-title" 
      aria-describedby="discard-dialog-desc" 
      hidden
    >
      <div class="discard-dialog-content">
        <div class="discard-dialog-header">
          <div class="discard-warning-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </div>
          <div>
            <h5 id="discard-dialog-title" class="discard-dialog-title">ยืนยันการล้างตะกร้าวัตถุดิบ?</h5>
            <p id="discard-dialog-desc" class="discard-dialog-desc">
              รายการวัตถุดิบทั้งหมดที่เลือกไว้จะถูกลบออกจากตะกร้า คุณแน่ใจหรือไม่ว่าต้องการดำเนินการต่อ?
            </p>
          </div>
        </div>

        <div class="discard-dialog-actions">
          <button type="button" id="btn-cancel-discard" data-testid="btn-cancel-discard" class="btn-pill btn-ghost btn-sm">
            ยกเลิก
          </button>
          <button type="button" id="btn-confirm-discard" data-testid="btn-confirm-discard" class="btn-pill btn-danger btn-sm">
            ล้างตะกร้าทันที
          </button>
        </div>
      </div>
    </div>
  </aside>
</div>
